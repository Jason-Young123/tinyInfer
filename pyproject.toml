[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tinyinfer"
version = "0.1.0"
description = "A tiny LLM inference runtime built step by step"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.4",
    "transformers>=4.51",
    "safetensors",
    "xxhash",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["tinyinfer*"]

